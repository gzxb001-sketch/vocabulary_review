# CI 门禁：每次推送/PR 自动跑完整验证链，防止 bug 复发进入主干
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 依赖漏洞扫描
        run: npm audit --audit-level=critical

      - name: 代码检查
        run: npm run lint

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build
        env:
          DATABASE_URL: file:./ci-placeholder.db
          JWT_SECRET: ci-only-secret
